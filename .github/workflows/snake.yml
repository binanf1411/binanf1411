name: Generate Snake

on:
  schedule:
    # Jalankan otomatis setiap 24 jam
    - cron: "0 0 * * *"
  
  # Memungkinkan dijalankan secara manual dari tab Actions
  workflow_dispatch:
  
  # Jalankan otomatis setiap kali push ke branch main/master
  push:
    branches:
    - main
    - master

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Generate gambar SVG animasi ular dari kontribusi GitHub
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Push file hasil ke branch 'output'
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
